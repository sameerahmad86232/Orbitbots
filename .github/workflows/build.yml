name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;35.0.0' 'platforms;android-35'
      - run: bash tests/run.sh
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk-requires-signing
          path: build/aligned.apk
  computer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==13.0.0 websockets==15.0.1
      - run: docker build -t orbit-computer:ci computer
      - run: docker run --rm --entrypoint python orbit-computer:ci /app/test_server.py
      - run: docker run --rm --entrypoint python orbit-computer:ci /app/test_agent.py
      - run: docker run --rm --entrypoint python orbit-computer:ci /app/test_extensions.py
      - name: Verify real desktop and bounded server loop
        env:
          ORBIT_TEST_TOKEN_FILE: ${{ runner.temp }}/orbit-test-token
          ORBIT_TEST_CONTAINER: orbit-computer-v3
          ORBIT_TEST_AGENT: '1'
          ORBIT_TEST_STREAM: '1'
        run: |
          python -c 'import os,secrets; from pathlib import Path; p=Path(os.environ["ORBIT_TEST_TOKEN_FILE"]); p.write_text(secrets.token_urlsafe(36)); p.chmod(0o600)'
          docker run -d --name orbit-computer-v3 --hostname orbit-computer --cap-drop ALL --security-opt no-new-privileges:true --memory 2g --cpus 2 --pids-limit 256 --shm-size 512m -p 127.0.0.1:8123:8080 -e ORBIT_TOKEN="$(cat "$ORBIT_TEST_TOKEN_FILE")" -e MODEL_BASE_URL=http://127.0.0.1:8130/v1 -e MODEL_ID=local-protocol-fixture orbit-computer:ci
          docker exec -d orbit-computer-v3 python /app/test_model_fixture.py
          python computer/test_live.py
      - name: Clean up test desktop
        if: always()
        run: docker rm -f orbit-computer-v3 || true
  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;35.0.0' 'platforms;android-35'
      - run: bash tests/android/build.sh
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tests/android/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-screenshot
          path: tests/android/build/app-smoke.png
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [android, computer, android-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.0.0 >/dev/null 2>&1; then
            gh release upload v4.0.0 downloads/Orbit-Bots-4.0.apk --clobber
          else
            gh release create v4.0.0 downloads/Orbit-Bots-4.0.apk --target "$GITHUB_SHA" --title 'Orbit Bot 4.0 — connected services, sync, media and live portals' --notes-file docs/release-notes.md
          fi
