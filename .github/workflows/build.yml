name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'build-tools;35.0.0' 'platforms;android-35'
      - run: bash tests/run.sh
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk-requires-signing
          path: build/aligned.apk
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 downloads/Orbit-Bots-2.0.apk --clobber
          else
            gh release create v2.0.0 downloads/Orbit-Bots-2.0.apk --target "$GITHUB_SHA" --title 'Orbit Bot 2.0 — providers, Ollama and web tools' --notes-file docs/release-notes.md
          fi
