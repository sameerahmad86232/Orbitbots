services:
  edge:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      ORBIT_DOMAIN: ${ORBIT_DOMAIN:?Set ORBIT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - orbit-tls-data:/data
      - orbit-tls-config:/config
    depends_on: [computer]
    restart: unless-stopped
volumes:
  orbit-tls-data:
  orbit-tls-config:
