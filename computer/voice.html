<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Orbit voice</title><style>body{font:17px system-ui;max-width:600px;margin:60px auto;padding:25px;background:#f5f3fa;color:#332b43}button,input{padding:14px;border-radius:16px;border:1px solid #ded7eb;margin:8px}button{background:#a595d0;color:white}#status{white-space:pre-wrap}</style><h1>Talk naturally.</h1><p>Live speech-to-speech through your server's configured OpenAI Realtime account. Microphone audio goes directly to the provider. Charges apply. No external-action tools.</p><input id="token" type="password" placeholder="Server or account access token"><button id="start">Start voice</button><button id="stop">End call</button><p id="status">Not connected. Requires HTTPS and microphone permission.</p><audio id="audio" autoplay></audio><script>
let peer,stream,timer;const $=id=>document.getElementById(id);function stop(){clearTimeout(timer);if(peer)peer.close();if(stream)stream.getTracks().forEach(t=>t.stop());peer=null;stream=null;$('audio').srcObject=null;$('status').textContent='Call ended';}$('stop').onclick=stop;$('start').onclick=async()=>{stop();const token=$('token').value;$('token').value='';try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});peer=new RTCPeerConnection();peer.ontrack=e=>{$('audio').srcObject=e.streams[0];$('audio').play().catch(()=>{});};for(const track of stream.getTracks())peer.addTrack(track,stream);peer.createDataChannel('oai-events');const offer=await peer.createOffer();await peer.setLocalDescription(offer);const r=await fetch('/voice/offer',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({sdp:offer.sdp})});if(!r.ok)throw Error('Voice setup HTTP '+r.status);await peer.setRemoteDescription({type:'answer',sdp:(await r.json()).sdp});$('status').textContent='Live voice connected. This page ends the call after five minutes.';timer=setTimeout(stop,300000);}catch(e){stop();$('status').textContent=e.message;}};window.addEventListener('pagehide',stop);
</script></html>
