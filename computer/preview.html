<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Orbit Computer</title><style>body{margin:30px auto;max-width:1000px;padding:20px;background:#f5f5f7;color:#202124;font:16px system-ui}button,input{padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px}img{width:100%;border-radius:20px;background:#ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere}.card{background:white;border-radius:20px;padding:20px;margin:16px 0}</style><h1>Orbit Computer</h1><p>Live desktop · every input requires approval · keep this session private</p><input id="token" type="password" placeholder="Server access token"><button id="connect">Connect</button><p id="status">Not connected</p><img id="screen" alt="Live desktop preview"><div class="card"><input id="text" placeholder="Text or https://URL"><button id="type">Queue typing</button><button id="url">Queue URL</button><button id="enter">Queue Enter</button><p>Click the preview to queue a real OS click. Approve it below to execute.</p></div><div id="actions"></div><script>
let token='',busy=false,connected=false;const $=id=>document.getElementById(id);async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('HTTP '+r.status);return r;}async function queue(a){try{await api('/actions','POST',a);await refresh();}catch(e){$('status').textContent=e.message;}}
$('connect').onclick=async()=>{token=$('token').value;$('token').value='';try{const s=await(await api('/status')).json();connected=true;$('status').textContent=s.ready?'Desktop connected':'Desktop not ready';await refresh();}catch(e){$('status').textContent=e.message;}};$('type').onclick=()=>queue({kind:'type',text:$('text').value});$('url').onclick=()=>queue({kind:'open_url',text:$('text').value});$('enter').onclick=()=>queue({kind:'key',text:'Return'});$('screen').onclick=e=>{const r=e.target.getBoundingClientRect();queue({kind:'click',x:Math.min(1279,Math.floor((e.clientX-r.left)*1280/r.width)),y:Math.min(799,Math.floor((e.clientY-r.top)*800/r.height))});};async function refresh(){if(busy||!connected||document.hidden)return;busy=true;try{const blob=await(await api('/screen')).blob(),old=$('screen').src;$('screen').src=URL.createObjectURL(blob);if(old.startsWith('blob:'))URL.revokeObjectURL(old);const data=await(await api('/actions')).json();$('actions').replaceChildren();for(const a of data.actions.filter(a=>a.status==='pending')){const c=document.createElement('div');c.className='card';const p=document.createElement('pre');p.textContent=JSON.stringify(a.payload,null,2);c.append(p);for(const yes of [true,false]){const b=document.createElement('button');b.textContent=yes?'Approve once':'Reject';b.onclick=async()=>{b.disabled=true;try{await api('/actions/'+a.id+'/review','POST',{approved:yes});}finally{await refresh();}};c.append(b);}$('actions').append(c);}}catch(e){$('status').textContent=e.message;}finally{busy=false;}}setInterval(refresh,1200);
</script></html>
