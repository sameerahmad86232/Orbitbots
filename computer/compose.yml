services:
  computer:
    build: .
    hostname: orbit-computer
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ORBIT_TOKEN: ${ORBIT_TOKEN:?Set ORBIT_TOKEN}
    volumes:
      - orbit-data:/data
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  orbit-data:
