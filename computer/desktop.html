<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Orbit live desktop</title><style>body{font:16px system-ui;background:#f5f3fa;color:#252235;margin:20px}input,button{padding:12px;border-radius:12px;border:1px solid #ddd;margin:6px}#screen{height:75vh;background:#18151f;border-radius:18px;overflow:hidden}p{color:#7a7188}</style><h2>Live desktop</h2><p>noVNC streaming · view only at the VNC server · use the app approval inbox for input.</p><input id="token" type="password" placeholder="Server or account access token"><button id="connect">Connect</button><p id="status">Not connected</p><div id="screen"></div><script type="module">
import RFB from '/novnc/core/rfb.js';let rfb,socket;document.getElementById('connect').onclick=async()=>{const input=document.getElementById('token'),token=input.value;input.value='';try{if(rfb)rfb.disconnect();const r=await fetch('/desktop/ticket',{method:'POST',headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Authentication or server error');const data=await r.json();socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/vnc');socket.binaryType='arraybuffer';socket.onopen=()=>socket.send(JSON.stringify({ticket:data.ticket}));socket.onmessage=event=>{if(event.data==='ready'){socket.onmessage=null;rfb=new RFB(document.getElementById('screen'),socket);rfb.viewOnly=true;rfb.scaleViewport=true;rfb.resizeSession=false;document.getElementById('status').textContent='Live · noVNC';rfb.addEventListener('disconnect',()=>document.getElementById('status').textContent='Disconnected');}};socket.onerror=()=>document.getElementById('status').textContent='Stream unavailable';}catch(e){document.getElementById('status').textContent=e.message;}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&rfb)rfb.disconnect();});
</script></html>
